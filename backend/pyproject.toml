[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kundali-backend"
version = "0.1.0"
description = "Kundali — Vedic astrology platform backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "swisseph-ffi>=0.1",
    "pyjwt>=2.8",
    "argon2-cffi>=23",
    "cryptography>=42",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "tzdata==2026.5",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "import-linter>=2",
]

[tool.uv]
package = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
"app.calc" = ["calendar_data/calendar.csv", "calendar_data/LICENSE", "calendar_data/NOTICE"]
"app.geo" = ["data/nepal.tsv.gz", "data/ATTRIBUTION.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["app.core.*", "app.calc.*"]
strict = true

[[tool.mypy.overrides]]
module = ["app.db.*", "app.api.*"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
